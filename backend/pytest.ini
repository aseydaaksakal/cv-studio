[pytest]
minversion = 7.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -k "session or app_complete or (commands and uygulama)"
markers =
    unit: unit tests (session module)
    integration: integration tests (API endpoints)
    slow: slow running tests
asyncio_mode = auto
