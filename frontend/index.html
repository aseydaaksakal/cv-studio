<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Studio</title>
<style>
:root{
  --desk:#23292f;
  --panel:#1a1f24;
  --edge:#333c45;
  --edge-soft:#2a3238;
  --text:#e7ebee;
  --dim:#98a4ae;
  --accent:#8fb0d8;
  --ok:#8fc9a4;
  --warn:#e0a15f;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono",monospace;
  --sheet-w:794px;
  --sheet-h:1123px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--desk);color:var(--text);
  font:14px/1.45 var(--ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- iskelet ---- */
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
#bar{
  display:flex;align-items:center;gap:16px;
  padding:10px 18px;border-bottom:1px solid var(--edge-soft);
  background:var(--panel);
}
.brand{font-weight:600;letter-spacing:.01em}
#who{color:var(--dim);font-size:13px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1}
.tools{display:flex;align-items:center;gap:6px}
.tool{
  padding:5px 10px;border:1px solid var(--edge);border-radius:6px;
  color:var(--dim);font-size:13px;
}
.tool:hover:not(:disabled){color:var(--text);border-color:var(--accent)}
.tool:disabled{opacity:.4;cursor:default}
.tool[aria-pressed="true"]{color:#12171c;background:var(--accent);border-color:var(--accent)}
.sep{width:1px;height:22px;background:var(--edge-soft)}
#oturum{max-width:210px;color:var(--text);background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:5px 8px}
#upload{display:none}
.upload{padding:5px 10px;border:1px dashed var(--edge);border-radius:6px;color:var(--dim);font-size:13px;cursor:pointer;position:relative;overflow:hidden}
.upload:hover,.upload.drag{color:var(--text);border-color:var(--accent);background:#202a33}

/* upload progress */
.upload-progress{position:absolute;left:0;top:0;height:100%;background:var(--accent);opacity:.15;width:0;transition:width .2s}
.upload-status{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none}
.upload-error{color:#e0605a;font-size:12px;margin-top:4px}

main{display:grid;grid-template-columns:1fr 360px;min-height:0}
#left{overflow:auto;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;display:flex;justify-content:center;align-items:center;padding:32px 32px 16px}

/* ---- kagit ---- */
#wrap{zoom:1;transform:none}         /* scale() DEGIL: zoom, metin net kalir */
#sheet{
  display:block;width:var(--sheet-w);height:var(--sheet-h);
  border:0;background:#fff;box-shadow:0 20px 48px rgba(0,0,0,.55);
}

/* ---- komut kutusu ---- */
#composer{
  position:sticky;bottom:0;z-index:5;
  display:flex;align-items:flex-end;gap:12px;
  padding:16px 24px 20px;
  background:linear-gradient(to top,var(--desk) 85%,rgba(35,41,47,0));
  border-top:1px solid var(--edge-soft);
}
#mic{
  flex:0 0 auto;width:40px;height:40px;border-radius:8px;
  border:1px solid var(--edge);background:var(--panel);
  display:grid;place-items:center;position:relative;
}
#mic:hover{border-color:var(--accent)}
#mic .dot{
  position:absolute;right:5px;bottom:5px;width:6px;height:6px;border-radius:50%;
  background:var(--warn);
}
#mic[data-durum="hazir"] .dot{background:var(--ok)}
#mic[data-durum="kayit"]{border-color:#d0645a;background:#3a2320}
#mic[data-durum="kayit"] .dot{background:#e0605a;animation:nabiz 1.1s infinite}
#mic[data-durum="cozuluyor"]{border-color:var(--accent)}
#mic[data-durum="cozuluyor"] .dot{background:var(--accent);animation:nabiz .7s infinite}
#mic:disabled{opacity:.5;cursor:default}
@keyframes nabiz{50%{opacity:.25}}
#sesbar{
  display:flex;align-items:center;gap:8px;padding:0 18px 6px;
  color:var(--dim);font-size:12px;
}
#sesbar select{
  font:inherit;color:var(--text);background:var(--panel);
  border:1px solid var(--edge);border-radius:6px;padding:3px 6px;
}
#sesbar .grow{flex:1}
#sessure{font:12px var(--mono);color:var(--warn);min-width:44px}
#cmd{
  flex:1;min-width:0;resize:none;max-height:160px;
  padding:12px 14px;border-radius:8px;
  border:1.5px solid var(--edge);background:var(--panel);color:var(--text);
  font:inherit;line-height:1.5;
  transition:all .2s ease;
}
#cmd:focus{
  border-color:var(--accent);box-shadow:0 0 0 2px rgba(143,176,216,.1);
  background:var(--desk);
}
#cmd::placeholder{color:#6d7983;}
#send{
  flex:0 0 auto;height:40px;padding:0 18px;border-radius:8px;
  background:var(--accent);color:#12171c;font-weight:600;
  transition:all .2s ease;box-shadow:0 2px 8px rgba(143,176,216,.3);
}
#send:hover:not(:disabled){
  transform:translateY(-2px);box-shadow:0 4px 16px rgba(143,176,216,.5);
}
#send:disabled{opacity:.45;cursor:default}
#hint{
  padding:8px 24px 12px;color:var(--accent);font-size:12.5px;min-height:18px;
  transition:color .3s ease;font-weight:500;
}

/* ---- degisiklik listesi ---- */
#right{
  border-left:1px solid var(--edge-soft);background:var(--panel);
  display:flex;flex-direction:column;min-height:0;
}
.rhead{
  display:flex;align-items:center;gap:8px;
  padding:12px 12px 10px 16px;border-bottom:1px solid var(--edge-soft);
}
.rhead .tool{padding:3px 9px;font-size:12px}
.rhead b{font-weight:600}
.rhead span{color:var(--dim);font-size:12.5px}
#log{overflow:auto;padding:8px 10px 24px;flex:1}
#empty{color:var(--dim);padding:18px 8px;font-size:13px}

.item{
  display:grid;grid-template-columns:34px 1fr 24px;gap:10px;padding:8px 6px;
  border-radius:6px;transition:background .2s ease;
}
.item:hover{background:rgba(143,176,216,.05)}
.del{width:24px;height:24px;border-radius:6px;color:#5f6b75;line-height:1;transition:all .2s ease}
.del:hover{color:#e0605a;background:#3a2320;cursor:pointer}
.item + .item{border-top:1px solid var(--edge-soft)}
.ico{
  width:34px;height:34px;border-radius:8px;
  border:1px solid var(--edge);background:#20262c;
  display:grid;place-items:center;color:var(--dim);
}
.ico:hover{border-color:var(--accent);color:var(--text)}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.item[data-open="true"] .ico{border-color:var(--accent);color:var(--accent)}
.item[data-kind="hata"] .ico{color:var(--warn);border-color:#5a4327}
.item[data-kind="bekliyor"] .ico svg{animation:spin 1.1s linear infinite;transform-origin:12px 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.item[data-kind="bekliyor"] .ico svg{animation:none}}

.msg{overflow-wrap:anywhere}
.said{color:var(--dim);font-size:12.5px;margin-bottom:2px;overflow-wrap:anywhere}
.meta{color:var(--dim);font-size:12px;margin-top:3px}
.meta i{font-style:normal;color:var(--ok)}
.think{
  display:none;margin-top:8px;padding:9px 10px;max-height:260px;overflow:auto;
  border-left:2px solid var(--accent);background:#171c21;border-radius:0 6px 6px 0;
  font:12.5px/1.55 var(--mono);white-space:pre-wrap;color:#c2ccd4;
}
.item[data-open="true"] .think{display:block}

/* ---- session modal ---- */
.modal{
  position:fixed;left:0;top:0;right:0;bottom:0;
  background:rgba(0,0,0,.6);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:40px;overflow-y:auto;
  animation:fadeIn .2s ease;backdrop-filter:blur(2px);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{
  background:var(--panel);border:1px solid var(--edge);border-radius:12px;
  width:90%;max-width:700px;box-shadow:0 24px 48px rgba(0,0,0,.8);
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{
  display:flex;align-items:center;gap:8px;
  padding:16px 20px;border-bottom:1px solid var(--edge-soft);
}
.modal-header h2{margin:0;font-size:16px;font-weight:600}
.close-btn{
  width:32px;height:32px;border-radius:6px;
  color:var(--dim);background:none;border:1px solid var(--edge);
  cursor:pointer;font:18px/1 monospace;
}
.close-btn:hover{color:var(--text);border-color:var(--accent)}
.modal-search{
  padding:12px 16px;border-bottom:1px solid var(--edge-soft)
}
.modal-search input{
  width:100%;padding:8px 12px;border-radius:6px;
  border:1px solid var(--edge);background:var(--desk);
  color:var(--text);font:inherit;
}
.modal-search input::placeholder{color:#6d7983}
.modal-body{
  max-height:500px;overflow-y:auto;padding:0
}
.session-table{
  width:100%;border-collapse:collapse;font-size:13px
}
.session-table th{
  padding:10px 12px;text-align:left;font-weight:600;
  background:var(--edge-soft);border-bottom:1px solid var(--edge);
  color:var(--text);
}
.session-table td{
  padding:10px 12px;border-bottom:1px solid var(--edge-soft);
  color:var(--text);
}
.session-table tr:hover{background:var(--edge-soft)}
.session-table tr.active{background:rgba(143,176,216,.1)}
.session-name{font-weight:600;color:var(--accent);cursor:pointer}
.session-name:hover{text-decoration:underline}
.session-meta{color:var(--dim);font-size:12px}
.session-actions{
  display:flex;gap:6px;align-items:center;justify-content:flex-end
}
.session-btn{
  padding:4px 8px;font-size:11px;border-radius:4px;
  border:1px solid var(--edge);color:var(--dim);
  background:none;cursor:pointer;
}
.session-btn:hover{color:var(--text);border-color:var(--accent)}
.session-btn.delete{color:#e0605a}
.session-btn.delete:hover{border-color:#e0605a}
.session-btn.danger{color:#e0605a;border-color:#5a4327}
.session-btn.danger:hover{border-color:#e0605a}
.session-btn.primary{color:var(--accent);border-color:var(--accent)}
.session-btn.primary:hover{background:rgba(143,176,216,.1)}

/* checkbox styling */
.session-checkbox{
  width:18px;height:18px;cursor:pointer;
  accent-color:var(--accent);
}
.session-table input[type="checkbox"]{
  accent-color:var(--accent);
}

/* ---- dialog ---- */
.dialog-content{
  background:var(--panel);border:1px solid var(--edge);border-radius:12px;
  width:90%;max-width:400px;padding:0;
  box-shadow:0 24px 48px rgba(0,0,0,.8);
}
.dialog-header{
  padding:16px 20px;border-bottom:1px solid var(--edge-soft)
}
.dialog-header h3{margin:0;font-size:16px;font-weight:600}
.dialog-content input{
  width:100%;padding:12px 20px;border:none;
  background:var(--desk);color:var(--text);font:inherit;
  box-sizing:border-box;
}
.dialog-content input::placeholder{color:#6d7983}
.dialog-actions{
  display:flex;gap:8px;justify-content:flex-end;
  padding:16px 20px;border-top:1px solid var(--edge-soft)
}
.dialog-actions button{
  padding:8px 16px;border-radius:6px;border:none;
  font:13px inherit;cursor:pointer;font-weight:600
}
.btn-primary{
  background:var(--accent);color:#12171c
}
.btn-primary:hover{opacity:.9}
.btn-secondary{
  background:var(--edge);color:var(--text)
}
.btn-secondary:hover{border-color:var(--accent)}
.btn-danger{
  background:#c83e3e;color:#fff
}
.btn-danger:hover{opacity:.9}

/* batch rename */
.batch-rename-row{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--edge-soft);align-items:center
}
.batch-rename-row:last-child{border-bottom:none}
.batch-rename-row label{color:var(--dim);font-size:12px;margin-bottom:4px;display:block}
.batch-rename-row input{
  width:100%;padding:8px 12px;border-radius:6px;
  border:1px solid var(--edge);background:var(--desk);color:var(--text);
  font:inherit
}
</style>
</head>
<body>
<div id="app">

  <header id="bar">
    <div class="brand">🎨 CV Studio</div>
    <label class="upload" id="uploadLabel" for="upload">
      📄 PDF/DOCX yükle
      <div class="upload-progress" id="uploadProgress"></div>
      <div class="upload-status" id="uploadStatus"></div>
    </label>
    <input id="upload" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    <div class="upload-error" id="uploadError"></div>
    <button class="tool" id="sessionBtn" title="Oturumları yönet">📋 Oturumlar</button>
    <div id="who" title="Aktif oturum ve dosya bilgisi">yükleniyor</div>
    <div class="grow"></div>
    <div class="tools">
      <button class="tool" data-z="0.5" title="Küçükten görüntüle">%50</button>
      <button class="tool" data-z="0.75" title="Orta boyut">%75</button>
      <button class="tool" data-z="1" title="Normal boyut">%100</button>
      <button class="tool" data-z="fit" title="Pencereye sığdır">🔍 Sığdır</button>
      <div class="sep"></div>
      <button class="tool" id="undo" disabled title="Son değişikliği geri al">↶ Geri al</button>
      <button class="tool" id="dreset" title="Tasarımı başlangıç haline döndür">⟲ Sıfırla</button>
    </div>
  </header>

  <main>
    <section id="left">
      <div id="stage">
        <div id="wrap"><iframe id="sheet" title="CV önizleme" src="/preview"></iframe></div>
      </div>
      <div id="composer">
        <button id="mic" data-durum="bos" title="Sesli komut: başlat / durdur" aria-label="Sesli komut">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/>
            <path d="M12 18v3"/>
          </svg>
          <span class="dot"></span>
        </button>
        <textarea id="cmd" rows="1" placeholder="✨ Ne değiştirelim? Örnek: başlıkları lacivert yap, metni büyült veya resim ekle"></textarea>
        <button id="send">📤 Gönder</button>
      </div>
      <div id="sesbar" style="gap:12px;line-height:1.6;padding:8px 24px;">
        <span style="font-weight:600;color:var(--accent);">🎤 Sesli Komut</span>

        <select id="sesbaglam" title="Konu profili" style="padding:4px 8px;font-size:12px;">
          <option value="cv">CV Konusu</option>
          <option value="yazilim">Yazılım</option>
          <option value="karisik">Karışık</option>
          <option value="osmanlica">Osmanlıca</option>
          <option value="genel">Genel</option>
        </select>

        <select id="sesdil" title="Dil" style="padding:4px 8px;font-size:12px;">
          <option value="tr">🇹🇷 Türkçe</option>
          <option value="en">🇬🇧 English</option>
          <option value="oto">Otomatik</option>
        </select>

        <select id="sesmodel" title="Model" style="padding:4px 8px;font-size:12px;">
          <option value="large-v3-turbo">⚡ Turbo (Hızlı)</option>
          <option value="large-v3">🎯 Large v3 (Doğru)</option>
        </select>

        <span id="sessure" style="min-width:60px;text-align:center;color:var(--warn);font-weight:600;"></span>
        <span class="grow"></span>
        <span id="sesbilgi" style="color:var(--ok);font-size:11px;"></span>
      </div>
      <div id="hint"></div>
    </section>

    <aside id="right">
      <div class="rhead"><b>📝 Değişiklik Geçmişi</b><span id="depth" style="color:var(--ok);font-weight:600;margin-left:8px;"></span>
        <div class="grow"></div>
        <button class="tool" id="clear" title="Sadece bu listeyi siler, CV'yi değiştirmez">🗑 Temizle</button>
      </div>
      <div id="log"><div id="empty">💡 Henüz değişiklik yok. Aşağıya bir komut yaz.</div></div>
    </aside>
  </main>

  <!-- Session Selector Modal -->
  <div id="sessionModal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Oturumlarım</h2>
        <div class="grow"></div>
        <button class="session-btn primary" id="newSessionBtn" title="Yeni oturum oluştur">+ Yeni</button>
        <button class="session-btn primary" id="batchRenameBtn" title="Seçili oturumları yeniden adlandır" style="display:none">✏ Yeniden Adlandır</button>
        <button class="session-btn primary" id="batchExportBtn" title="Seçili oturumları indir (ZIP)" style="display:none">📦 İndir</button>
        <button class="session-btn danger" id="batchDeleteBtn" title="Seçili oturumları sil" style="display:none">🗑 Sil</button>
        <button class="close-btn" id="closeSession" aria-label="Kapat">✕</button>
      </div>
      <div class="modal-search">
        <input type="text" id="sessionSearch" placeholder="Oturum adında ara...">
      </div>
      <div class="modal-body">
        <table class="session-table" id="sessionTable">
          <thead>
            <tr>
              <th style="width:30px"><input type="checkbox" id="selectAllChk"></th>
              <th>Ad</th>
              <th>Kaynak</th>
              <th>Bölümler</th>
              <th>Durumu</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="sessionList"></tbody>
        </table>
        <div id="sessionEmpty" style="display:none;text-align:center;padding:24px;color:var(--dim)">
          Henüz oturum yok
        </div>
      </div>
    </div>
  </div>

  <!-- Rename Dialog -->
  <div id="renameDialog" class="modal" style="display:none">
    <div class="dialog-content">
      <div class="dialog-header">
        <h3>Adı Değiştir</h3>
      </div>
      <input type="text" id="renameInput" placeholder="Yeni ad..." autofocus>
      <div class="dialog-actions">
        <button id="renamCancel" class="btn-secondary">İptal</button>
        <button id="renameOk" class="btn-primary">Değiştir</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Dialog -->
  <div id="deleteDialog" class="modal" style="display:none">
    <div class="dialog-content">
      <div class="dialog-header">
        <h3>Oturumu Sil</h3>
      </div>
      <p id="deleteMsg" style="color:var(--text);margin:16px 0">Bu işlem geri alınamaz.</p>
      <div class="dialog-actions">
        <button id="deleteCancel" class="btn-secondary">İptal</button>
        <button id="deleteOk" class="btn-danger">Sil</button>
      </div>
    </div>
  </div>

  <!-- New Session Dialog -->
  <div id="newSessionDialog" class="modal" style="display:none">
    <div class="dialog-content">
      <div class="dialog-header">
        <h3>Yeni Oturum</h3>
      </div>
      <input type="text" id="newSessionInput" placeholder="Oturum adı (örn: Benim CV)" autofocus>
      <div class="dialog-actions">
        <button id="newSessionCancel" class="btn-secondary">İptal</button>
        <button id="newSessionOk" class="btn-primary">Oluştur</button>
      </div>
    </div>
  </div>

  <!-- Batch Rename Modal -->
  <div id="batchRenameModal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Oturumları Yeniden Adlandır</h2>
        <div class="grow"></div>
        <button class="close-btn" id="closeBatchRename" aria-label="Kapat">✕</button>
      </div>
      <div class="modal-body" style="max-height:600px;overflow-y:auto;padding:16px">
        <div id="batchRenameList"></div>
      </div>
      <div class="modal-header" style="border-top:1px solid var(--edge-soft);border-bottom:none;padding:12px 20px">
        <div class="grow"></div>
        <button id="batchRenamCancel" class="btn-secondary">İptal</button>
        <button id="batchRenameOk" class="btn-primary">Değişiklikleri Uygula</button>
      </div>
    </div>
  </div>

  <!-- Notes Modal -->
  <div id="notesModal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Notlar</h2>
        <div class="grow"></div>
        <button class="close-btn" id="closeNotes" aria-label="Kapat">✕</button>
      </div>
      <div style="padding:16px">
        <div style="color:var(--dim);font-size:12px;margin-bottom:8px">Oturum: <span id="notesSessionName" style="color:var(--text);font-weight:600"></span></div>
        <textarea id="notesInput" placeholder="Notunuzu yazın... (max 1000 karakter)"
                  style="width:100%;height:200px;padding:12px;border-radius:6px;border:1px solid var(--edge);background:var(--desk);color:var(--text);font:inherit;resize:vertical"
                  maxlength="1000"></textarea>
        <div style="color:var(--dim);font-size:11px;margin-top:8px">
          <span id="noteCharCount">0</span> / 1000
        </div>
      </div>
      <div class="modal-header" style="border-top:1px solid var(--edge-soft);border-bottom:none;padding:12px 20px">
        <div class="grow"></div>
        <button id="notesCancel" class="btn-secondary">İptal</button>
        <button id="notesSave" class="btn-primary">Kaydet</button>
      </div>
    </div>
  </div>
</div>

<script>
const A4W = 794, A4H = 1123;
const $ = s => document.querySelector(s);
const stage = $("#stage"), left = $("#left"), wrap = $("#wrap"), sheet = $("#sheet");
const cmd = $("#cmd"), send = $("#send"), log = $("#log"), hint = $("#hint");
const undoBtn = $("#undo"), dresetBtn = $("#dreset");
const upload = $("#upload"), uploadLabel = $("#uploadLabel");
const sessionModal = $("#sessionModal"), sessionBtn = $("#sessionBtn");
const sessionList = $("#sessionList"), sessionSearch = $("#sessionSearch"), sessionTable = $("#sessionTable");
const sessionEmpty = $("#sessionEmpty"), closeSession = $("#closeSession");
let aktifOturum = "";
let oturumlar = [];

/* ---------- zoom: transform yerine CSS zoom ---------- */
let zmode = "fit";
function fitK(){
  const w = left.clientWidth - 48;
  const h = left.clientHeight - $("#composer").offsetHeight - $("#hint").offsetHeight - 32;
  return Math.max(0.2, Math.min(w / A4W, h / A4H));
}
function applyZoom(){
  const k = zmode === "fit" ? fitK() : parseFloat(zmode);
  wrap.style.zoom = k;
  document.querySelectorAll(".tool[data-z]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.z === zmode)));
}
document.querySelectorAll(".tool[data-z]").forEach(b =>
  b.addEventListener("click", () => { zmode = b.dataset.z; applyZoom(); }));
addEventListener("resize", () => { if (zmode === "fit") applyZoom(); });

/* ---------- ikonlar ---------- */
const ICON = {
  tasarim:'<path d="M12 3c0 0-6 7.2-6 10.8a6 6 0 0 0 12 0C18 10.2 12 3 12 3z"/>',
  tasarim_sifirla:'<path d="M12 3c0 0-6 7.2-6 10.8a6 6 0 0 0 12 0C18 10.2 12 3 12 3z"/><path d="M4 20 20 4"/>',
  geri_al:'<path d="M4 9h11a5 5 0 0 1 0 10h-6"/><path d="M8 5 4 9l4 4"/>',
  duzenle:'<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M15 6l3 3"/>',
  ekle:'<path d="M12 5v14M5 12h14"/>',
  sil:'<path d="M6 8h12l-1 12H7z"/><path d="M9.5 8V5h5v3"/>',
  belirsiz:'<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.4 2.4 0 1 1 2.9 2.6v1.4"/><path d="M12.4 17h.01"/>',
  hata:'<path d="M12 4 2.5 20h19z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
  bekliyor:'<circle cx="12" cy="12" r="8.5" stroke-dasharray="14 8"/>'
};
function iconFor(eylem, kind){
  if (kind === "hata") return "hata";
  if (kind === "bekliyor") return "bekliyor";
  const e = (eylem || "").toLowerCase();
  if (e in ICON) return e;
  if (e.includes("sifirla") || e.includes("sıfırla")) return "tasarim_sifirla";
  if (e.includes("tasarim") || e.includes("css")) return "tasarim";
  if (e.includes("geri") || e.includes("undo")) return "geri_al";
  if (e.includes("sil")) return "sil";
  if (e.includes("ekle")) return "ekle";
  if (e.includes("belirsiz")) return "belirsiz";
  return "duzenle";
}

/* ---------- degisiklik listesi ---------- */
function emptyState(){
  log.innerHTML = '<div id="empty">Henüz değişiklik yok. Aşağıya bir komut yaz.</div>';
}
$("#clear").addEventListener("click", emptyState);

function addEntry(said){
  $("#empty")?.remove();
  const el = document.createElement("div");
  el.className = "item";
  el.dataset.kind = "bekliyor";
  el.dataset.open = "false";
  el.innerHTML =
    '<button class="ico" aria-expanded="false" aria-label="Düşünceyi aç"></button>' +
    '<div><div class="said"></div><div class="msg"></div>' +
    '<div class="meta"></div><pre class="think"></pre></div>' +
    '<button class="del" aria-label="Bu satırı listeden sil">&#215;</button>';
  el.querySelector(".said").textContent = said;
  el.querySelector(".msg").textContent = "çalışıyor";
  el.querySelector(".ico").innerHTML = '<svg viewBox="0 0 24 24">' + ICON.bekliyor + '</svg>';
  el.querySelector(".ico").addEventListener("click", () => {
    const open = el.dataset.open === "true";
    el.dataset.open = String(!open);
    el.querySelector(".ico").setAttribute("aria-expanded", String(!open));
  });
  el.querySelector(".del").addEventListener("click", () => {
    el.remove();
    if (!log.querySelector(".item")) emptyState();
  });
  log.prepend(el);

  const t0 = Date.now();
  const tick = setInterval(() => {
    el.querySelector(".meta").textContent = ((Date.now() - t0) / 1000).toFixed(1) + " sn";
  }, 200);

  return function finish(o){
    clearInterval(tick);
    el.dataset.kind = o.kind;
    el.querySelector(".ico").innerHTML =
      '<svg viewBox="0 0 24 24">' + ICON[iconFor(o.eylem, o.kind)] + '</svg>';
    el.querySelector(".msg").textContent = o.message || "";
    const bits = [];
    if (o.eylem) bits.push(o.eylem);
    if (o.sure != null) bits.push(o.sure + " sn");
    if (o.guven != null) bits.push("güven " + o.guven);
    el.querySelector(".meta").innerHTML =
      (o.applied ? "<i>uygulandı</i> " : "") + bits.join(", ");
    const th = (o.thinking || "").trim();
    el.querySelector(".think").textContent = th || "Model düşünce döndürmedi.";
    if (!th) el.querySelector(".ico").title = "Düşünce yok";
  };
}

/* ---------- sunucu ---------- */
async function jpost(url, body){
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: body === undefined ? "{}" : JSON.stringify(body)
  });
  return r.json();
}
async function refreshSheet(){
  if (!aktifOturum) return;
  await fetch("http://localhost:8000/render?id=" + encodeURIComponent(aktifOturum));
  sheet.src = "/preview?id=" + encodeURIComponent(aktifOturum) + "&t=" + Date.now();
}
async function loadState(){
  try{
    const s = await (await fetch("http://localhost:8000/state?id=" + encodeURIComponent(aktifOturum))).json();
    if (!s.ok) { $("#who").textContent = s.error || "durum okunamadı"; return; }
    $("#who").textContent = [s.name, s.title].filter(Boolean).join(", ");
    const n = s.sections.reduce((a, x) => a + x.items, 0);
    $("#depth").textContent = s.sections.length + " bölüm, " + n + " kayıt";
    undoBtn.disabled = !s.depth;
    undoBtn.textContent = s.depth ? "Geri al (" + s.depth + ")" : "Geri al";
  }catch(e){ $("#who").textContent = "sunucuya ulaşılamadı"; }
}

async function loadOturumlar(){
  const d = await (await fetch("http://localhost:8000/oturum")).json();
  aktifOturum = d.aktif || "";
  oturumlar = d.oturumlar || [];
  renderSessionList(oturumlar);
}

let seciliOturumlar = new Set();

const STORAGE_KEY = "cv-studio:selected-sessions";

function persistSelections(){
  try {
    const ids = Array.from(seciliOturumlar);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
  } catch (e) {
    console.warn("localStorage unavailable:", e.message);
  }
}

function loadSelections(){
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const ids = JSON.parse(stored);
      seciliOturumlar.clear();
      ids.forEach(id => seciliOturumlar.add(id));
    }
  } catch (e) {
    console.warn("Failed to load selections from localStorage:", e.message);
    seciliOturumlar.clear();
  }
}

function updateBatchDeleteBtn(){
  const batchBtn = $("#batchDeleteBtn");
  if (seciliOturumlar.size > 0) {
    batchBtn.style.display = "inline-block";
    batchBtn.textContent = `🗑 Sil (${seciliOturumlar.size})`;
  } else {
    batchBtn.style.display = "none";
  }
}

function updateBatchRenameBtn(){
  const batchBtn = $("#batchRenameBtn");
  if (seciliOturumlar.size > 0) {
    batchBtn.style.display = "inline-block";
  } else {
    batchBtn.style.display = "none";
  }
}

function updateBatchExportBtn(){
  const batchBtn = $("#batchExportBtn");
  if (seciliOturumlar.size > 0) {
    batchBtn.style.display = "inline-block";
    batchBtn.textContent = `📦 İndir (${seciliOturumlar.size})`;
  } else {
    batchBtn.style.display = "none";
  }
}

function renderSessionList(filtrelenmisList){
  sessionList.innerHTML = "";
  if (!filtrelenmisList.length) {
    sessionEmpty.style.display = "block";
    sessionTable.style.display = "none";
    return;
  }
  sessionEmpty.style.display = "none";
  sessionTable.style.display = "table";

  for (const o of filtrelenmisList) {
    const tr = document.createElement("tr");
    if (o.id === aktifOturum) tr.classList.add("active");

    const durumu = o.hazir ? (o.gecmis > 0 ? `${o.gecmis} adım` : "Yeni") : "İşleniyor";

    tr.innerHTML = `
      <td><input type="checkbox" class="session-checkbox" data-id="${o.id}"></td>
      <td><span class="session-name" data-id="${o.id}">${o.ad || o.id}</span></td>
      <td><span class="session-meta">${o.kaynak || "—"}</span></td>
      <td><span class="session-meta">${o.bolum} bölüm</span></td>
      <td><span class="session-meta">${durumu}</span></td>
      <td class="session-actions">
        <button class="session-btn notes" data-id="${o.id}" title="Notlar">${o.notlar ? "💬" : "📝"}</button>
        <button class="session-btn copy" data-id="${o.id}" title="Kopyala">📋</button>
        <button class="session-btn rename" data-id="${o.id}" title="Adını değiştir">✎</button>
        <button class="session-btn delete" data-id="${o.id}" title="Sil">🗑</button>
      </td>
    `;

    // Checkbox seçimi
    const chk = tr.querySelector(".session-checkbox");
    chk.checked = seciliOturumlar.has(o.id);
    chk.addEventListener("change", (e) => {
      if (e.target.checked) {
        seciliOturumlar.add(o.id);
      } else {
        seciliOturumlar.delete(o.id);
      }
      updateBatchDeleteBtn();
      updateBatchRenameBtn();
      updateBatchExportBtn();
      updateSelectAllCheckbox();
      persistSelections();
    });

    // Session seç
    tr.querySelector(".session-name").addEventListener("click", () => {
      selectSession(o.id);
    });

    // Rename
    tr.querySelector(".rename").addEventListener("click", (e) => {
      e.stopPropagation();
      renameSession(o.id, o.ad || o.id);
    });

    // Delete
    tr.querySelector(".delete").addEventListener("click", (e) => {
      e.stopPropagation();
      deleteSession(o.id);
    });

    // Copy
    tr.querySelector(".copy").addEventListener("click", (e) => {
      e.stopPropagation();
      copySession(o.id, o.ad || o.id);
    });

    // Notes
    tr.querySelector(".notes").addEventListener("click", (e) => {
      e.stopPropagation();
      showNotesDialog(o.id, o.ad || o.id, o.notlar || "");
    });

    sessionList.appendChild(tr);
  }
}

function filterSessions(){
  const q = sessionSearch.value.toLowerCase();
  const filtered = oturumlar.filter(o => (o.ad || o.id).toLowerCase().includes(q));
  renderSessionList(filtered);
}

async function selectSession(id){
  const r = await jpost("/oturum/sec", {id});
  if (r.ok) {
    aktifOturum = id;
    await refreshSheet();
    await loadState();
    sessionModal.style.display = "none";
    renderSessionList(oturumlar);
  }
}

function showRenameDialog(id, currentName){
  const renameDialog = $("#renameDialog");
  const renameInput = $("#renameInput");
  const renameOk = $("#renameOk");
  const renameCancel = $("#renamCancel");

  renameInput.value = currentName;
  renameDialog.style.display = "flex";
  renameInput.select();

  const handleOk = async () => {
    const yeni = renameInput.value.trim();
    if (!yeni || yeni === currentName) {
      renameDialog.style.display = "none";
      return;
    }
    const r = await jpost("/oturum/ad", {id, ad: yeni});
    renameDialog.style.display = "none";
    if (r.ok) {
      await loadOturumlar();
      hint.textContent = "Oturum adı değiştirildi";
    } else {
      hint.textContent = "Ad değiştirme başarısız: " + (r.error || "Bilinmeyen hata");
    }
  };

  const handleCancel = () => {
    renameDialog.style.display = "none";
  };

  renameOk.onclick = handleOk;
  renameCancel.onclick = handleCancel;
  renameInput.onkeydown = (e) => {
    if (e.key === "Enter") handleOk();
    if (e.key === "Escape") handleCancel();
  };
}

function showDeleteDialog(id){
  const deleteDialog = $("#deleteDialog");
  const deleteMsg = $("#deleteMsg");
  const deleteOk = $("#deleteOk");
  const deleteCancel = $("#deleteCancel");
  const ad = oturumlar.find(o => o.id === id)?.ad || id;

  deleteMsg.textContent = `"${ad}" oturumunu silmek istiyor musunuz? Bu işlem geri alınamaz.`;
  deleteDialog.style.display = "flex";

  const handleOk = async () => {
    deleteDialog.style.display = "none";
    const r = await jpost("/oturum/sil", {id});
    if (r.ok) {
      await loadOturumlar();
      if (r.aktif) {
        aktifOturum = r.aktif;
        await refreshSheet();
        await loadState();
      }
      hint.textContent = "Oturum silindi";
    } else {
      hint.textContent = "Silme başarısız: " + (r.error || "Bilinmeyen hata");
    }
  };

  const handleCancel = () => {
    deleteDialog.style.display = "none";
  };

  deleteOk.onclick = handleOk;
  deleteCancel.onclick = handleCancel;
}

async function deleteSession(id){
  const dialog = $("#deleteDialog");
  const ad = oturumlar.find(o => o.id === id)?.ad || id;
  $("#deleteMsg").textContent = `"${ad}" oturumunu silmek istiyor musunuz? Bu işlem geri alınamaz.`;
  dialog.style.display = "flex";

  return new Promise((resolve) => {
    const deleteOk = async () => {
      dialog.style.display = "none";
      const r = await jpost("/oturum/sil", {id});
      if (r.ok) {
        await loadOturumlar();
        if (r.aktif) {
          aktifOturum = r.aktif;
          await refreshSheet();
          await loadState();
        }
        hint.textContent = "Oturum silindi";
      } else {
        hint.textContent = "Silme başarısız: " + (r.error || "Bilinmeyen hata");
      }
      resolve();
    };

    const deleteCancel = () => {
      dialog.style.display = "none";
      resolve();
    };

    $("#deleteOk").onclick = deleteOk;
    $("#deleteCancel").onclick = deleteCancel;
  });
}

async function renameSession(id, currentName){
  const dialog = $("#renameDialog");
  const input = $("#renameInput");
  input.value = currentName;
  dialog.style.display = "flex";
  input.select();
  input.focus();

  return new Promise((resolve) => {
    const submit = async () => {
      const yeni = input.value.trim();
      dialog.style.display = "none";
      if (!yeni || yeni === currentName) {
        resolve();
        return;
      }
      const r = await jpost("/oturum/ad", {id, ad: yeni});
      if (r.ok) {
        await loadOturumlar();
        hint.textContent = "Oturum adı değiştirildi";
      } else {
        hint.textContent = "Ad değiştirme başarısız: " + (r.error || "Bilinmeyen hata");
      }
      resolve();
    };

    const cancel = () => {
      dialog.style.display = "none";
      resolve();
    };

    $("#renameOk").onclick = submit;
    $("#renamCancel").onclick = cancel;
    input.onkeydown = (e) => {
      if (e.key === "Enter") submit();
      if (e.key === "Escape") cancel();
    };
  });
}

async function copySession(id, name){
  const dialog = $("#deleteDialog");
  const deleteMsg = $("#deleteMsg");
  const deleteOk = $("#deleteOk");
  const deleteCancel = $("#deleteCancel");

  deleteMsg.textContent = `"${name}" oturumunu kopyalamak istiyor musunuz? Yeni oturum "${name} (Kopya)" adıyla oluşturulacak.`;
  dialog.style.display = "flex";

  return new Promise((resolve) => {
    const handleOk = async () => {
      dialog.style.display = "none";
      hint.textContent = "Oturum kopyalanıyor...";
      try {
        const r = await jpost(`/oturum/${id}/kopyala`, {});
        if (r.ok) {
          await loadOturumlar();
          hint.textContent = `"${name}" oturumu kopyalandı: ${r.oturum.ad}`;
        } else {
          hint.textContent = "Kopyalama başarısız: " + (r.error || "Bilinmeyen hata");
        }
      } catch (e) {
        hint.textContent = "Kopyalama hatası: " + e.message;
      }
      resolve();
    };

    const handleCancel = () => {
      dialog.style.display = "none";
      resolve();
    };

    deleteOk.onclick = handleOk;
    deleteCancel.onclick = handleCancel;
  });
}

async function showBatchRenameDialog(){
  if (seciliOturumlar.size === 0) return;

  const dialog = $("#batchRenameModal");
  const list = $("#batchRenameList");
  const closeBtn = $("#closeBatchRename");
  const cancelBtn = $("#batchRenamCancel");
  const okBtn = $("#batchRenameOk");

  // Build input rows
  const renames = {};
  list.innerHTML = "";
  const ids = Array.from(seciliOturumlar);

  for (const id of ids) {
    const o = oturumlar.find(x => x.id === id);
    if (!o) continue;

    renames[id] = o.ad;
    const div = document.createElement("div");
    div.className = "batch-rename-row";
    div.innerHTML = `
      <div>
        <label>Mevcut Ad</label>
        <div style="color:var(--text);padding:8px;background:var(--edge-soft);border-radius:6px">${o.ad}</div>
      </div>
      <div>
        <label>Yeni Ad</label>
        <input type="text" class="batch-input" data-id="${id}" value="${o.ad}" placeholder="Yeni ad girin...">
      </div>
    `;
    list.appendChild(div);
  }

  dialog.style.display = "flex";

  return new Promise((resolve) => {
    const handleOk = async () => {
      const renames_list = [];
      document.querySelectorAll(".batch-input").forEach(inp => {
        const newName = inp.value.trim();
        if (newName) {
          renames_list.push({id: inp.dataset.id, newName: newName});
        }
      });

      if (renames_list.length === 0) {
        hint.textContent = "Ad değişikliği yapılmadı";
        dialog.style.display = "none";
        resolve();
        return;
      }

      dialog.style.display = "none";
      hint.textContent = "Oturumlar yeniden adlandırılıyor...";
      try {
        const r = await jpost("/oturum/batch-ad-degistir", {renames: renames_list});
        if (r.ok) {
          seciliOturumlar.clear();
          persistSelections();
          updateBatchDeleteBtn();
          updateBatchRenameBtn();
          await loadOturumlar();
          hint.textContent = `${renames_list.length} oturum yeniden adlandırıldı`;
        } else {
          hint.textContent = "Yeniden adlandırma başarısız: " + (r.error || "Bilinmeyen hata");
        }
      } catch (e) {
        hint.textContent = "Hata: " + e.message;
      }
      resolve();
    };

    const handleCancel = () => {
      dialog.style.display = "none";
      resolve();
    };

    okBtn.onclick = handleOk;
    cancelBtn.onclick = handleCancel;
    closeBtn.onclick = handleCancel;
  });
}

function updateSelectAllCheckbox(){
  const allChk = $("#selectAllChk");
  const chks = document.querySelectorAll(".session-checkbox");
  if (chks.length === 0) {
    allChk.checked = false;
    allChk.indeterminate = false;
  } else {
    const checked = document.querySelectorAll(".session-checkbox:checked").length;
    allChk.checked = checked === chks.length && chks.length > 0;
    allChk.indeterminate = checked > 0 && checked < chks.length;
  }
}

async function showNotesDialog(id, name, currentNotes){
  const modal = $("#notesModal");
  const textarea = $("#notesInput");
  const charCount = $("#noteCharCount");
  const sessionName = $("#notesSessionName");
  const saveBtn = $("#notesSave");
  const cancelBtn = $("#notesCancel");
  const closeBtn = $("#closeNotes");

  sessionName.textContent = name;
  textarea.value = currentNotes;
  charCount.textContent = currentNotes.length;
  modal.style.display = "flex";
  textarea.focus();

  // Character counter
  const updateCount = () => {
    charCount.textContent = textarea.value.length;
  };
  textarea.addEventListener("input", updateCount);

  return new Promise((resolve) => {
    const handleSave = async () => {
      modal.style.display = "none";
      const notlar = textarea.value.trim();
      hint.textContent = "Not kaydediliyor...";
      try {
        const r = await jpost(`/oturum/${id}/notlar`, {notlar});
        if (r.ok) {
          await loadOturumlar();
          hint.textContent = notlar ? "Not kaydedildi" : "Not silindi";
        } else {
          hint.textContent = "Not kaydedilemedi: " + (r.error || "Bilinmeyen hata");
        }
      } catch (e) {
        hint.textContent = "Hata: " + e.message;
      }
      textarea.removeEventListener("input", updateCount);
      resolve();
    };

    const handleCancel = () => {
      modal.style.display = "none";
      textarea.removeEventListener("input", updateCount);
      resolve();
    };

    saveBtn.onclick = handleSave;
    cancelBtn.onclick = handleCancel;
    closeBtn.onclick = handleCancel;
  });
}

async function showNewSessionDialog(){
  const dialog = $("#newSessionDialog");
  const input = $("#newSessionInput");
  input.value = "";
  dialog.style.display = "flex";
  input.focus();

  return new Promise((resolve) => {
    const submit = async () => {
      const ad = input.value.trim();
      dialog.style.display = "none";
      if (!ad) {
        resolve();
        return;
      }
      const r = await jpost("/oturum/yeni", {ad, kaynak: ""});
      if (r.ok) {
        await loadOturumlar();
        seciliOturumlar.clear();
        persistSelections();
        updateBatchDeleteBtn();
        hint.textContent = `"${ad}" oturumu oluşturuldu`;
      } else {
        hint.textContent = "Oturum oluşturma başarısız: " + (r.error || "Bilinmeyen hata");
      }
      resolve();
    };

    const cancel = () => {
      dialog.style.display = "none";
      resolve();
    };

    $("#newSessionOk").onclick = submit;
    $("#newSessionCancel").onclick = cancel;
    input.onkeydown = (e) => {
      if (e.key === "Enter") submit();
      if (e.key === "Escape") cancel();
    };
  });
}

async function batchDeleteSessions(){
  if (seciliOturumlar.size === 0) return;

  const ids = Array.from(seciliOturumlar);
  const count = ids.length;

  const dialog = $("#deleteDialog");
  const deleteMsg = $("#deleteMsg");
  const deleteOk = $("#deleteOk");
  const deleteCancel = $("#deleteCancel");

  const msg = count === 1 ? "Bu oturumu silmek istiyor musunuz?" : `${count} oturumu silmek istiyor musunuz?`;
  deleteMsg.textContent = msg + "\nBu işlem geri alınamaz.";
  dialog.style.display = "flex";

  return new Promise((resolve) => {
    const handleOk = async () => {
      dialog.style.display = "none";
      const r = await jpost("/oturum/batch-sil", {ids});
      if (r.ok) {
        seciliOturumlar.clear();
        persistSelections();
        updateBatchDeleteBtn();
        await loadOturumlar();
        hint.textContent = `${count} oturum silindi`;
      } else {
        hint.textContent = "Silme başarısız: " + (r.error || "Bilinmeyen hata");
      }
      resolve();
    };

    const handleCancel = () => {
      dialog.style.display = "none";
      resolve();
    };

    deleteOk.onclick = handleOk;
    deleteCancel.onclick = handleCancel;
  });
}

async function batchExportSessions(){
  if (seciliOturumlar.size === 0) return;

  const ids = Array.from(seciliOturumlar);
  const count = ids.length;
  hint.textContent = `${count} oturum indiriliyor...`;

  try {
    const response = await fetch("http://localhost:8000/oturum/export", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ids})
    });

    if (!response.ok) {
      const r = await response.json();
      hint.textContent = "İndirme başarısız: " + (r.error || "Bilinmeyen hata");
      return;
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "cv-studio-export.zip";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    hint.textContent = `${count} oturum indirildi`;
  } catch (e) {
    hint.textContent = "İndirme hatası: " + e.message;
  }
}

async function yukleDosya(file){
  if (!file) return;

  // Dosya doğrulama
  const uz = file.name.split(".").pop()?.toLowerCase() || "";
  const kabul = ["pdf", "docx"];
  if (!kabul.includes(uz)) {
    $("#uploadError").textContent = "Desteklenmeyen format. PDF veya DOCX dosyası seçin.";
    return;
  }
  const maxMB = 50; // backend'de yapılan kontrol ile uyumlu
  if (file.size > maxMB * 1024 * 1024) {
    $("#uploadError").textContent = `Dosya ${maxMB}MB'tan büyük. Seçileniz: ${(file.size / 1024 / 1024).toFixed(1)}MB`;
    return;
  }

  // UI hazırla
  const errorEl = $("#uploadError");
  if (errorEl) errorEl.textContent = "";
  const progress = $("#uploadProgress");
  const status = $("#uploadStatus");

  // Eğer progress element yoksa, sahte bir obje oluştur
  const progressSafe = progress || { style: {} };
  const statusSafe = status || {};

  upload.disabled = true;

  const formData = new FormData();
  formData.append("dosya", file, file.name);

  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();

    // Upload progress tracking
    xhr.upload.addEventListener("progress", (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        if (progressSafe.style) progressSafe.style.width = pct + "%";
        if (statusSafe) statusSafe.textContent = pct + "%";
      }
    });

    xhr.addEventListener("load", async () => {
      try {
        const r = JSON.parse(xhr.responseText);
        if (!r.ok) {
          $("#uploadError").textContent = "Yükleme hatası: " + (r.error || "Bilinmeyen hata");
          uploadLabel.textContent = "PDF/DOCX yükle";
          if (progressSafe.style) progressSafe.style.width = "0";
          if (statusSafe) statusSafe.textContent = "";
          upload.value = "";
          upload.disabled = false;
          resolve();
          return;
        }

        // Başarılı: HEMENve oturuma geç
        if (progressSafe.style) progressSafe.style.width = "100%";
        if (statusSafe) statusSafe.textContent = "✓";

        aktifOturum = r.id;
        hint.textContent = "Dosya işleniyor: " + file.name;

        // Hemen sayfayı yükle
        await loadOturumlar();
        await refreshSheet();
        await loadState();

        // Arka planda işlenme durumunu kontrol et
        if (r.islemeniyor) {
          hint.textContent = "Dosya işleniyor, lütfen bekleyin...";
          let kontrol_sayisi = 0;
          const max_kontrol = 120; // 2 dakika (her saniye kontrol)

          const kontrol_timer = setInterval(async () => {
            kontrol_sayisi++;
            if (kontrol_sayisi >= max_kontrol) {
              clearInterval(kontrol_timer);
              return;
            }

            try {
              // Durumu kontrol et (GET, POST değil!)
              const response = await fetch(`http://localhost:8000/state?id=${encodeURIComponent(aktifOturum)}`);
              const state = await response.json();

              // PDF işlenmesi tamamlandı mı? (sections varsa = içerik yüklendi)
              if (state.ok && state.sections && state.sections.length > 0) {
                // İçerik yüklendi! (work, education, skills vs varsa)
                const totalItems = state.sections.reduce((sum, s) => sum + (s.items || 0), 0);

                if (totalItems > 0) {
                  // İşlem bitti, sayfayı yenile
                  clearInterval(kontrol_timer);
                  await refreshSheet();
                  await loadState();
                  hint.textContent = file.name + " işlendi: " + state.sections.length + " bölüm";

                  // UI'yi temizle
                  await new Promise(r => setTimeout(r, 500));
                  if (progressSafe.style) progressSafe.style.width = "0";
                  if (statusSafe) statusSafe.textContent = "";
                }
              }
            } catch (e) {
              // Sessizce devam et
            }
          }, 1000);
        } else {
          // İşlem zaten bitti
          hint.textContent = file.name + " işlendi: " + r.bolum + " bölüm";
          await new Promise(r => setTimeout(r, 500));
          if (progressSafe.style) progressSafe.style.width = "0";
          if (statusSafe) statusSafe.textContent = "";
        }

        // Sıfırla
        uploadLabel.textContent = "PDF/DOCX yükle";
        upload.value = "";
      } catch (e) {
        $("#uploadError").textContent = "Sunucu cevabı okunamadı: " + e.message;
        uploadLabel.textContent = "PDF/DOCX yükle";
        if (progressSafe.style) progressSafe.style.width = "0";
        if (statusSafe) statusSafe.textContent = "";
        upload.value = "";
      } finally {
        upload.disabled = false;
        resolve();
      }
    });

    xhr.addEventListener("error", () => {
      $("#uploadError").textContent = "Bağlantı hatası. Lütfen tekrar deneyiniz.";
      uploadLabel.textContent = "PDF/DOCX yükle";
      if (progressSafe.style) progressSafe.style.width = "0";
      if (statusSafe) statusSafe.textContent = "";
      upload.value = "";
      upload.disabled = false;
      resolve();
    });

    xhr.addEventListener("abort", () => {
      $("#uploadError").textContent = "Yükleme iptal edildi.";
      uploadLabel.textContent = "PDF/DOCX yükle";
      if (progressSafe.style) progressSafe.style.width = "0";
      if (statusSafe) statusSafe.textContent = "";
      upload.value = "";
      upload.disabled = false;
      resolve();
    });

    xhr.open("POST", "http://localhost:8000/upload");
    xhr.send(formData);
  });
}
upload.addEventListener("change", () => {
  if (upload.files[0]) yukleDosya(upload.files[0]);
});

uploadLabel.addEventListener("click", () => {
  // Reset file input so same file can be selected again
  upload.value = "";
});

uploadLabel.addEventListener("dragover", e => {
  e.preventDefault();
  uploadLabel.classList.add("drag");
});

uploadLabel.addEventListener("dragleave", () => {
  uploadLabel.classList.remove("drag");
});

uploadLabel.addEventListener("drop", e => {
  e.preventDefault();
  uploadLabel.classList.remove("drag");
  const file = e.dataTransfer.files[0];
  if (file) {
    // Create new DataTransfer to set files (files property is read-only)
    const dt = new DataTransfer();
    dt.items.add(file);
    upload.files = dt.files;
    yukleDosya(file);
  }
});

/* ---------- sira: arka planda tek tek calisir ---------- */
const queue = [];
let busy = false;
function enqueue(job){ queue.push(job); pump(); }
async function pump(){
  if (busy) return;
  const job = queue.shift();
  if (!job) return;
  busy = true;
  hint.textContent = "İşleniyor" + (queue.length ? ", sırada " + queue.length : "");
  try { await job(); } finally {
    busy = false;
    hint.textContent = queue.length ? "Sırada " + queue.length : "";
    pump();
  }
}
function run(said, fn){
  const finish = addEntry(said);
  enqueue(async () => {
    try{
      const r = await fn();
      finish({
        kind: r.ok === false ? "hata" : "bitti",
        eylem: r.eylem, applied: r.applied, sure: r.sure,
        guven: r.guven, thinking: r.thinking,
        message: r.ok === false ? (r.error || "Sunucu hatası") : r.message
      });
      if (r.applied) await refreshSheet();
      await loadState();
    }catch(e){
      finish({kind: "hata", message: "Sunucuya ulaşılamadı: " + e.message});
    }
  });
}

/* ---------- sesli komut (6d-5c) ---------- */
const mic = $("#mic"), sesSure = $("#sessure"), sesBilgi = $("#sesbilgi");
let kaydedici = null, sesParcalari = [], kayitta = false, sayacId = 0, t0ses = 0;

function sesMime(){
  const a = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];
  for (const m of a) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return "";
}

function micDurum(d, baslik){
  mic.dataset.durum = d;
  if (baslik) mic.title = baslik;
}

async function isit(){
  try{
    const f = new FormData();
    f.append("model", $("#sesmodel").value);
    const r = await (await fetch("http://localhost:8000/voice/warmup", {method:"POST", body:f})).json();
    sesBilgi.textContent = "model hazır (" + r.sure + " sn)";
    micDurum("hazir", "Sesli komut: başlat");
  }catch(e){ sesBilgi.textContent = "ses sunucusu yok"; }
}

async function sesBaslat(){
  if (!navigator.mediaDevices || !window.MediaRecorder){
    hint.textContent = "Tarayıcı mikrofon kaydını desteklemiyor.";
    return;
  }
  try{
    const akis = await navigator.mediaDevices.getUserMedia({
      audio:{channelCount:1, echoCancellation:true, noiseSuppression:true}});
    const tur = sesMime();
    kaydedici = new MediaRecorder(akis, tur ? {mimeType:tur} : {});
    sesParcalari = [];
    kaydedici.ondataavailable = e => { if (e.data.size) sesParcalari.push(e.data); };
    kaydedici.onstop = () => { akis.getTracks().forEach(t => t.stop()); sesGonder(); };
    kaydedici.start();
    kayitta = true;
    t0ses = Date.now();
    micDurum("kayit", "Kaydı durdur");
    hint.textContent = "Dinliyorum. Bitince mikrofona tekrar bas.";
    sayacId = setInterval(() => {
      sesSure.textContent = ((Date.now() - t0ses)/1000).toFixed(1) + " sn";
    }, 100);
  }catch(e){
    hint.textContent = "Mikrofona erişilemedi: " + e.message;
  }
}

function sesDurdur(){
  if (!kaydedici || !kayitta) return;
  kayitta = false;
  clearInterval(sayacId);
  kaydedici.stop();
  micDurum("cozuluyor", "Çözülüyor");
  hint.textContent = "Çözülüyor...";
}

async function sesGonder(){
  const tur = kaydedici.mimeType || sesMime() || "audio/webm";
  const uz = tur.includes("ogg") ? "ogg" : tur.includes("mp4") ? "mp4" : "webm";
  const blob = new Blob(sesParcalari, {type:tur});
  const veri = new FormData();
  veri.append("ses", blob, "kayit." + uz);
  veri.append("baglam", $("#sesbaglam").value);
  veri.append("dil", $("#sesdil").value);
  veri.append("model", $("#sesmodel").value);

  mic.disabled = true;
  try{
    const c = await fetch("http://localhost:8000/voice", {method:"POST", body:veri});
    if (!c.ok){
      hint.textContent = "Ses çözülemedi (HTTP " + c.status + ").";
      sesBilgi.textContent = "";
    } else {
      const d = await c.json();
      const onceki = cmd.value.trim();
      cmd.value = (onceki ? onceki + " " : "") + d.metin;   // BIRIKIR, ezmez
      cmd.dispatchEvent(new Event("input"));
      cmd.focus();
      cmd.setSelectionRange(cmd.value.length, cmd.value.length);
      sesBilgi.textContent = d.ses_suresi + " sn ses, " + d.sure + " sn çözme, " +
        d.dil + " (" + d.guven + "), düzeltme " + d.duzeltme;
      hint.textContent = "Metni oku, gerekirse düzelt, Enter'a bas.";
    }
  }catch(e){
    hint.textContent = "Ses sunucusuna ulaşılamadı: " + e.message;
  }finally{
    mic.disabled = false;
    sesSure.textContent = "";
    micDurum("hazir", "Sesli komut: başlat");
  }
}

mic.addEventListener("click", () => kayitta ? sesDurdur() : sesBaslat());
addEventListener("keydown", e => {
  if (e.ctrlKey && e.code === "Space" && document.activeElement !== cmd){
    e.preventDefault();
    kayitta ? sesDurdur() : sesBaslat();
  }
});
